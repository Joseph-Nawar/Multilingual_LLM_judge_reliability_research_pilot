[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual-llm-judge-reliability-pilot"
version = "0.1.0"
description = "Research foundation for a controlled English-Arabic LLM judge feasibility pilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools]
packages = ["multilingual_judge_pilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
